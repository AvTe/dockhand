# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0de0af659b1350f4eac27b0c0d5b97be"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
name = "Dockhand"

[webhooks]
api_version = "2026-10"

  # Only inventory_levels/update is active right now. It is the one topic this
  # app needs that carries NO protected customer data, so it subscribes without
  # approval.
  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/api/webhooks/shopify"

  # BLOCKED ON APPROVAL -- uncomment the block below once the app has been
  # granted Protected Customer Data access in the Partner Dashboard
  # (Apps -> Dockhand -> API access -> Protected customer data access).
  # Order and refund payloads contain customer PII, so subscribing without that
  # approval makes `shopify app dev` fail outright with
  # "This app is not approved to subscribe to webhook topics containing
  # protected customer data."
  #
  # Only these two are listed, not orders/updated or orders/cancelled:
  # mapTopicToTrigger() in src/app/api/webhooks/shopify/route.ts returns null
  # for those, so subscribing to them would deliver events that no-op.
  # Add them here at the same time as the code that handles them.
  #
  #   [[webhooks.subscriptions]]
  #   topics = [ "orders/create", "refunds/create" ]
  #   uri = "/api/webhooks/shopify"

  # TODO (build order step 4): the 3 mandatory GDPR compliance webhooks
  # (customers/data_request, customers/redact, shop/redact) go in a
  # [webhooks.privacy_compliance] block. Not added yet because no route
  # handles them -- declaring them now would just point Shopify at 404s.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_inventory,read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
