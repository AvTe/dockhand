# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0de0af659b1350f4eac27b0c0d5b97be"
application_url = "https://dockhand-4cks.vercel.app"
embedded = true
name = "Dockhand"

[webhooks]
api_version = "2026-10"

  # No protected customer data in this one, so it needs no special approval.
  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/api/webhooks/shopify"

  # Order and refund payloads carry protected customer data. These stay
  # subscribed only while the app holds Protected Customer Data access in the
  # Partner Dashboard; without it, `shopify app dev` fails to start.
  #
  # Deliberately not orders/updated or orders/cancelled: mapTopicToTrigger()
  # returns null for both, so subscribing would deliver events that no-op.
  [[webhooks.subscriptions]]
  topics = [ "orders/create", "refunds/create" ]
  uri = "/api/webhooks/shopify"

  # TODO (build order step 4): the 3 mandatory GDPR compliance webhooks
  # (customers/data_request, customers/redact, shop/redact) go in a
  # [webhooks.privacy_compliance] block. Not added yet because no route
  # handles them -- declaring them now would just point Shopify at 404s.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_inventory,read_products"

[auth]
redirect_urls = [ "https://dockhand-4cks.vercel.app/api/auth" ]

[build]
automatically_update_urls_on_dev = true
